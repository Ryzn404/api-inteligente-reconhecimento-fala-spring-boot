# Perfil para testar a IA de graça com a Groq, que tem uma API compatível com a da OpenAI.
# Uso: defina GROQ_API_KEY e ative o perfil, por exemplo: --spring.profiles.active=local,groq
# Chat (com Tool Calling) e transcrição vão para a Groq. A Groq não tem voz em português,
# então a resposta em áudio do POST /transactions/ai continua usando a OpenAI (precisa de créditos).
spring.ai.openai.api-key=${OPENAI_API_KEY:sem-chave-openai}

spring.ai.openai.chat.base-url=https://api.groq.com/openai
spring.ai.openai.chat.api-key=${GROQ_API_KEY}
# A Groq desativa modelos com frequência (veja console.groq.com/docs/deprecations).
# Para trocar sem mexer no código, defina a variável GROQ_CHAT_MODEL.
spring.ai.openai.chat.options.model=${GROQ_CHAT_MODEL:openai/gpt-oss-120b}

spring.ai.openai.audio.transcription.base-url=https://api.groq.com/openai
spring.ai.openai.audio.transcription.api-key=${GROQ_API_KEY}
spring.ai.openai.audio.transcription.options.model=whisper-large-v3-turbo
